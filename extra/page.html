<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Treadmill Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 90%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: bold;
        }

        .treadmill-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
        }

        .treadmill {
            background: #2c3e50;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
            width: 100%;
            max-width: 500px;
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .arrow-sequence {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: nowrap;
            overflow: hidden;
            padding: 10px;
        }

        .arrow {
            font-size: clamp(2rem, 8vw, 4rem);
            width: clamp(60px, 15vw, 100px);
            height: clamp(60px, 15vw, 100px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-50px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .arrow.removing {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideOut {
            to {
                transform: translateX(50px);
                opacity: 0;
            }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            padding: clamp(10px, 3vw, 15px) clamp(20px, 5vw, 30px);
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #666;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #666;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-warning {
            background: #e74c3c;
            color: white;
        }

        .instructions {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
        }

        .key-hint {
            display: inline-block;
            padding: 5px 15px;
            background: #333;
            color: white;
            border-radius: 5px;
            margin: 0 5px;
            font-weight: bold;
        }

        .game-over {
            text-align: center;
            padding: 20px;
            background: #e74c3c;
            color: white;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            display: none;
        }

        .game-over.show {
            display: block;
            animation: pulse 0.5s;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .score-highlight {
            animation: scorePop 0.3s;
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #2ecc71; }
            100% { transform: scale(1); }
        }

        @media (max-width: 600px) {
            .treadmill {
                padding: 20px 10px;
            }
            
            .arrow-sequence {
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎯 Arrow Treadmill</h1>
        
        <div class="stats">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="high-score">High Score: <span id="highScore">0</span></div>
            <div class="misses">Misses: <span id="misses">0</span>/3</div>
        </div>

        <div class="treadmill-container">
            <div class="treadmill">
                <div class="arrow-sequence" id="arrowSequence">
                    <!-- Arrows will be inserted here -->
                </div>
            </div>
        </div>

        <div class="game-over" id="gameOver">
            Game Over! Final Score: <span id="finalScore">0</span>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn">▶ Start Game</button>
            <button class="btn btn-warning" id="resetBtn">↺ Reset</button>
        </div>

        <div class="instructions">
            <p>Press the <span class="key-hint">→</span> Right Arrow key when the <strong>RIGHT arrow</strong> appears!</p>
            <p>The arrow will disappear and new arrows will slide in from the left.</p>
            <p>Miss 3 arrows and game over!</p>
            <p style="margin-top: 10px; color: #666;">Current arrows: <span id="arrowCount">0</span></p>
        </div>
    </div>

    <script>
        class ArrowTreadmillGame {
            constructor() {
                // Game state
                this.arrows = [];
                this.score = 0;
                this.misses = 0;
                this.maxMisses = 3;
                this.highScore = localStorage.getItem('arrowTreadmillHighScore') || 0;
                this.gameActive = false;
                this.speed = 500; // Initial speed in ms (slower for easier gameplay)
                this.minSpeed = 200;
                this.speedDecrease = 20;
                
                // DOM elements
                this.arrowSequenceEl = document.getElementById('arrowSequence');
                this.scoreEl = document.getElementById('score');
                this.highScoreEl = document.getElementById('highScore');
                this.missesEl = document.getElementById('misses');
                this.gameOverEl = document.getElementById('gameOver');
                this.finalScoreEl = document.getElementById('finalScore');
                this.arrowCountEl = document.getElementById('arrowCount');
                this.startBtn = document.getElementById('startBtn');
                this.resetBtn = document.getElementById('resetBtn');
                
                // Arrow types
                this.arrowSymbols = {
                    'left': '←',
                    'right': '→',
                    'up': '↑',
                    'down': '↓'
                };
                
                // Bind methods
                this.handleKeyPress = this.handleKeyPress.bind(this);
                this.startGame = this.startGame.bind(this);
                this.resetGame = this.resetGame.bind(this);
                
                // Initialize
                this.init();
            }
            
            init() {
                // Event listeners
                this.startBtn.addEventListener('click', this.startGame);
                this.resetBtn.addEventListener('click', this.resetGame);
                document.addEventListener('keydown', this.handleKeyPress);
                
                // Display high score
                this.updateHighScoreDisplay();
                
                // Initialize with some arrows
                this.arrows = this.generateRandomArrows(5);
                this.renderArrows();
            }
            
            generateRandomArrows(count) {
                const arrowTypes = ['left', 'right', 'up', 'down'];
                return Array(count).fill().map(() => 
                    arrowTypes[Math.floor(Math.random() * arrowTypes.length)]
                );
            }
            
            renderArrows() {
                this.arrowSequenceEl.innerHTML = '';
                
                // Show only last 3 arrows (the visible ones on the treadmill)
                const visibleArrows = this.arrows.slice(-3);
                
                visibleArrows.forEach((arrow, index) => {
                    const arrowEl = document.createElement('div');
                    arrowEl.className = 'arrow';
                    arrowEl.textContent = this.arrowSymbols[arrow];
                    arrowEl.setAttribute('data-arrow', arrow);
                    arrowEl.setAttribute('data-index', this.arrows.length - 3 + index);
                    
                    // Add different colors for different arrow types
                    if (arrow === 'right') {
                        arrowEl.style.background = '#e8f5e8';
                        arrowEl.style.color = '#27ae60';
                        arrowEl.style.border = '2px solid #27ae60';
                    } else if (arrow === 'left') {
                        arrowEl.style.background = '#fff3e0';
                        arrowEl.style.color = '#e67e22';
                        arrowEl.style.border = '2px solid #e67e22';
                    } else if (arrow === 'up') {
                        arrowEl.style.background = '#e3f2fd';
                        arrowEl.style.color = '#3498db';
                        arrowEl.style.border = '2px solid #3498db';
                    } else if (arrow === 'down') {
                        arrowEl.style.background = '#f3e5f5';
                        arrowEl.style.color = '#9b59b6';
                        arrowEl.style.border = '2px solid #9b59b6';
                    }
                    
                    this.arrowSequenceEl.appendChild(arrowEl);
                });
                
                // Update arrow count display
                this.arrowCountEl.textContent = this.arrows.length;
            }
            
            removeRightArrow() {
                // Find the first right arrow from the left (oldest)
                const rightArrowIndex = this.arrows.findIndex(arrow => arrow === 'right');
                
                if (rightArrowIndex !== -1) {
                    // Found a right arrow - remove it
                    this.arrows.splice(rightArrowIndex, 1);
                    
                    // Increase score
                    this.score += 10;
                    this.updateScore();
                    
                    // Add new arrow to the beginning (left side)
                    const newArrow = this.generateRandomArrows(1)[0];
                    this.arrows.unshift(newArrow);
                    
                    // Speed up game slightly
                    if (this.speed > this.minSpeed) {
                        this.speed -= this.speedDecrease;
                    }
                    
                    // Visual feedback
                    this.scoreEl.classList.add('score-highlight');
                    setTimeout(() => this.scoreEl.classList.remove('score-highlight'), 300);
                    
                    return true;
                }
                
                return false; // No right arrow found
            }
            
            handleKeyPress(event) {
                if (!this.gameActive) return;
                
                // Check for right arrow key
                if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    
                    if (this.removeRightArrow()) {
                        // Success - update display
                        this.renderArrows();
                        
                        // Check win condition (optional - if you want a win condition)
                        if (this.score >= 100) {
                            this.gameOver('win');
                        }
                    } else {
                        // Miss - no right arrow to remove
                        this.misses++;
                        this.updateMisses();
                        
                        // Visual feedback for miss
                        document.body.style.backgroundColor = '#ffebee';
                        setTimeout(() => {
                            document.body.style.backgroundColor = '';
                        }, 200);
                        
                        if (this.misses >= this.maxMisses) {
                            this.gameOver('lose');
                        }
                    }
                }
            }
            
            updateScore() {
                this.scoreEl.textContent = this.score;
                
                // Update high score
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('arrowTreadmillHighScore', this.highScore);
                    this.updateHighScoreDisplay();
                }
            }
            
            updateHighScoreDisplay() {
                this.highScoreEl.textContent = this.highScore;
            }
            
            updateMisses() {
                this.missesEl.textContent = this.misses;
            }
            
            gameOver(reason) {
                this.gameActive = false;
                
                if (reason === 'lose') {
                    this.finalScoreEl.textContent = this.score;
                    this.gameOverEl.classList.add('show');
                    
                    // Flash red
                    document.body.style.backgroundColor = '#ffcdd2';
                    setTimeout(() => {
                        document.body.style.backgroundColor = '';
                    }, 500);
                } else if (reason === 'win') {
                    alert(`🎉 Congratulations! You won with ${this.score} points!`);
                }
                
                this.startBtn.textContent = '▶ Play Again';
            }
            
            startGame() {
                // Reset game state but keep arrows
                this.gameActive = true;
                this.score = 0;
                this.misses = 0;
                this.speed = 500;
                
                // Generate new arrows
                this.arrows = this.generateRandomArrows(5);
                
                // Update displays
                this.updateScore();
                this.updateMisses();
                this.renderArrows();
                
                // Hide game over message
                this.gameOverEl.classList.remove('show');
                
                // Update button
                this.startBtn.textContent = '▶ Game Active';
                
                // Visual feedback
                document.body.style.backgroundColor = '#e8f5e8';
                setTimeout(() => {
                    document.body.style.backgroundColor = '';
                }, 300);
            }
            
            resetGame() {
                this.gameActive = false;
                this.score = 0;
                this.misses = 0;
                this.speed = 500;
                this.arrows = this.generateRandomArrows(5);
                
                this.updateScore();
                this.updateMisses();
                this.renderArrows();
                
                this.gameOverEl.classList.remove('show');
                this.startBtn.textContent = '▶ Start Game';
            }
        }

        // Initialize the game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ArrowTreadmillGame();
        });
    </script>
</body>
</html>
