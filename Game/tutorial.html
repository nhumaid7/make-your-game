<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How to Play - Friends</title>
    <link rel="stylesheet" href="/Game/css/style.css">
</head>
<body class="tutorial-page">

    <!-- Curtain Transition Effect -->
    <div class="curtain-overlay">
        <div class="curtain-panel left open" id="curtainTop">
            <div class="curtain-fold"></div>
        </div>
        <div class="curtain-panel right open" id="curtainBottom">
            <div class="curtain-fold"></div>
        </div>
    </div>

    <div class="page-content" id="pageContent">
        <button id="backToMenuBtn" class="back-to-menu-btn">← Back to Main Menu</button>

        <div class="tutorial-stage">
            <div class="tutorial-panel">
                <h1 class="tutorial-panel-title">How to Play</h1>
                <p class="tutorial-panel-subtitle">Follow the sequence</p>

                <div class="tut-strip-wrapper">
                    <div class="tut-target-zone" id="tutTargetZone">
                        <div class="tut-target-box"></div>
                    </div>
                    <div class="tut-arrow-track" id="tutArrowTrack">
                        <!-- arrows injected by JS -->
                    </div>
                </div>

                <p class="tut-hint" id="tutHint">Press the matching arrow key!</p>
            </div>

            <div class="tut-player-label">P1</div>
        </div>
    </div>

    <script src="/Game/js/audio.js"></script>
    <script src="/Game/js/tutorial.js"></script>
    <script src="/Game/js/navigation.js"></script>
</body>
</html>
