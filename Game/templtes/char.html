<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Choose Character</title>
	<link rel="stylesheet" href="/Game/css/style.css">
</head>
<body class="choose-char-page">

	<main class="char-scene" aria-label="Choose character">
		<img class="char-background" src="/Game/assets/images/char/background.svg" alt="">
            
                 

		<button class="nav-arrow prev" id="prevBtn" type="button" aria-label="Previous character">
			<img src="/Game/assets/images/char/prev.svg" alt="">
		</button>

		<div class="character-stage">
			<img class="character-image" id="characterImage" alt="Selected character">
		</div>

		<button class="nav-arrow next" id="nextBtn" type="button" aria-label="Next character">
			<img src="/Game/assets/images/char/next.svg" alt="">
		</button>

		<button class="character-name-btn" id="chooseBtn" type="button" aria-label="Choose character">
			<img id="characterNameImage" alt="Selected character name">
		</button>
		<p class="status" id="statusText" aria-live="polite"></p>
	</main>

	<script src="/Game/js/char.js"></script>
</body>
</html>
